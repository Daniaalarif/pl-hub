<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PL Hub</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231e3fd8'/%3E%3Cpath d='M9 23V9h6a4 4 0 0 1 0 8h-6M19 9v14h5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* PL Hub — "Bold Blocks": warm grey ground, white rounded blocks, one electric blue, one orange for "needs you" */
:root{
  --bg:#f2f1ee; --card:#ffffff; --ink:#111111; --muted:#57544e; --line:#d9d6cf; --soft:#ebe9e4;
  --blue:#1e3fd8; --blue-d:#132a99; --blue-soft:#e7ecff;
  --orange:#ff8a3d; --orange-soft:#ffe6d4;
  --green:#17683f; --green-soft:#e2f3e9;
  --red:#b42318;
  --r:24px; --r-sm:14px;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.row{display:flex;align-items:center}
.wrapflex{flex-wrap:wrap}
.gap8{gap:8px}.gap12{gap:12px}
.spacer{flex:1}
.muted{color:var(--muted)}
.blue-t{color:var(--blue)}

/* pills / buttons */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--ink);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill:hover{filter:brightness(1.12)}
.pill.sm{min-height:36px;padding:0 14px;font-size:14px;font-weight:500}
.pill.big{min-height:52px;font-size:16px}
.pill.blue{background:var(--blue)}
.pill.white{background:#fff;color:var(--blue)}
.pill.outline{background:#fff;color:var(--ink);border-color:var(--line);font-weight:500}
.pill.outline:hover{filter:none;border-color:var(--ink)}
.pill.outline-white{background:transparent;color:#fff;border:2px solid #fff}
.pill.blue-outline{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.pill.ghost{background:transparent;color:var(--muted);font-weight:500}
.pill.ghost:hover{color:var(--ink);filter:none}
.pill.danger{background:#fff;color:var(--red);border-color:var(--line);font-weight:500}
.pill.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.pill[disabled]{opacity:.55;cursor:wait}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(242,241,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand.big{font-size:40px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;background:transparent}
.nav a:hover{border-color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{background:var(--orange);color:var(--ink);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;line-height:18px}
.savestate{margin-left:auto;font-size:13px;color:var(--muted);min-width:48px;text-align:right}
main{padding-block:22px 80px;display:flex;flex-direction:column;gap:18px}

/* blocks */
.card{background:var(--card);border-radius:var(--r)}
.pad{padding:22px}
.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.headline h1{font-size:clamp(34px,5vw,48px);font-weight:700;letter-spacing:-.02em}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sectionhead h2{font-size:22px}

/* dashboard bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.dump{grid-column:span 2;grid-row:span 2;background:var(--blue);color:#fff;border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:14px}
.dump label{font-size:clamp(26px,3vw,34px);font-weight:700;line-height:1.05}
.dump textarea{flex:1;min-height:170px;border:none;border-radius:16px;padding:16px;font-size:16px;background:#fff;color:var(--ink);resize:vertical}
.stat{border-radius:var(--r);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:164px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid transparent}
.stat:hover{border-color:var(--ink)}
.stat b{font-size:64px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--muted)}
.stat.orange{background:var(--orange)}
.stat.orange small{color:#3b2410}
.stat.ink{background:var(--ink);color:#fff}
.stat.ink small{color:#cfccc6}
.stat.ink:hover{border-color:var(--blue)}
.span4{grid-column:1/-1}
.span2{grid-column:span 2}
@media (max-width:980px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.span4,.dump{grid-column:1/-1}.dump{grid-row:auto}}
@media (max-width:520px){.bento{grid-template-columns:minmax(0,1fr)}.span2{grid-column:1/-1}.stat b{font-size:48px}}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.dashed{background:transparent;border-style:dashed;border-color:#8a877f}

/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent}
.pcard:hover{border-color:var(--ink)}
.pimg{aspect-ratio:4/3;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;text-decoration:none;color:var(--blue);text-align:center;overflow:hidden}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ph{font-size:14px;font-weight:500;padding:12px}
.ph small{font-weight:400;color:var(--muted)}
.pbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);flex:1}
.pbody strong{font-size:18px;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
.newdrop{border:2px dashed #8a877f;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:300px;text-align:center;padding:20px;cursor:pointer;background:transparent}
.newdrop strong{font-size:18px}
.drop.over{outline:3px dashed var(--blue);outline-offset:-8px;background:var(--blue-soft)!important}

/* stage + status pills */
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.st-Idea,.st-Parked{background:var(--soft);color:var(--ink)}
.st-Researching{background:var(--orange-soft);color:#7a3a0c}
.st-Shortlisted{background:var(--ink);color:#fff}
.st-Sampling{background:var(--blue);color:#fff}
.st-Ordered{background:var(--blue-soft);color:var(--blue-d)}
.st-Live{background:var(--green-soft);color:var(--green)}
.ss-onway{background:var(--blue);color:#fff}
.ss-arrived{background:var(--orange);color:var(--ink)}
.ss-approved{background:var(--ink);color:#fff}
.ss-rejected{background:var(--soft);color:var(--ink)}
.ss-all{background:#fff;color:var(--ink)}

/* forms */
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addinput{display:flex;align-items:center;background:#fff;border-radius:999px;padding:0 18px;min-height:50px;flex:1 1 280px;border:1px solid var(--line)}
.addinput input{border:none;outline:none;background:transparent;width:100%;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 12px}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.inline-field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.inline-field select{min-height:42px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;color:var(--ink)}
.search{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;flex:1 1 240px;max-width:420px}
.search input{border:none;outline:none;width:100%;background:transparent}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* product page */
.crumbs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.gcol{flex:1 1 380px;max-width:520px;display:flex;flex-direction:column;gap:10px;min-width:0}
.icol{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.hero{aspect-ratio:1/1;max-width:100%;background:var(--blue-soft);border-radius:var(--r);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden;text-align:center;color:var(--blue)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.hero .corner{position:absolute;right:14px;bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thumb{aspect-ratio:1/1;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line);overflow:hidden;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.add{border:2px dashed #8a877f;background:transparent;font-size:26px}
.hint{font-size:13px;color:var(--muted);margin:0}
.name-input{width:100%;font-size:clamp(26px,3.4vw,38px);font-weight:700;line-height:1.1;border:1px solid transparent;border-radius:12px;padding:4px 8px;margin-left:-9px;background:transparent}
.name-input:hover,.name-input:focus{border-color:var(--line);background:#fff;outline:none}
.toprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.selpill{min-height:36px;border-radius:999px;border:none;padding:0 12px;font-size:13px;font-weight:500;cursor:pointer}
.asin{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 4px 0 12px;min-height:36px;background:#fff}
.asin input{border:none;outline:none;width:118px;font-size:13px;background:transparent;text-transform:uppercase}
.catsel{min-height:36px;border:1px solid var(--line);border-radius:999px;padding:0 10px;background:#fff;font-size:13px}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nums.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.nums,.nums.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
.numbox{background:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.numbox span{font-size:12px;color:var(--muted)}
.numbox b{font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numbox input{border:none;background:transparent;font-size:22px;font-weight:700;width:100%;padding:0;outline:none;font-variant-numeric:tabular-nums}
.numbox.dark{background:var(--ink);color:#fff}.numbox.dark span{color:#cfccc6}
.numbox.blue{background:var(--blue);color:#fff}.numbox.blue span{color:#d6ddff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabbody{display:flex;flex-direction:column;gap:14px}
.comp{display:grid;grid-template-columns:minmax(0,2.2fr) 100px 100px 120px minmax(0,2fr) auto;gap:10px;align-items:end;padding:14px 0;border-top:1px solid var(--soft)}
.comp:first-of-type{border-top:none;padding-top:0}
@media (max-width:900px){.comp{grid-template-columns:repeat(2,minmax(0,1fr))}.comp .wide{grid-column:1/-1}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mock{margin:0;display:flex;flex-direction:column;gap:8px}
.mock a{display:block;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.mock img{width:100%;height:100%;object-fit:contain}
.mock .acts{display:flex;gap:6px;flex-wrap:wrap}
.bigdrop{border:2px dashed #8a877f;border-radius:16px;padding:22px;text-align:center;cursor:pointer;display:block}

/* samples */
.statrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:820px){.statrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.statbtn{text-align:left;border:3px solid transparent;border-radius:22px;padding:16px 18px;font:inherit;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.statbtn span{font-size:14px}
.statbtn b{font-size:46px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.statbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.statbtn.ss-approved[aria-pressed="true"]{border-color:var(--blue)}
.split{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.slist{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:14px}
.scard{background:#fff;border-radius:var(--r);padding:16px;display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:700px){.scard{grid-template-columns:96px minmax(0,1fr)}.sactions{grid-column:1/-1}}
.sphoto{aspect-ratio:1/1;border-radius:16px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;text-align:center;color:var(--blue);font-size:13px}
.sphoto img{width:100%;height:100%;object-fit:cover}
.sphoto img.faded{opacity:.35}
.sphoto .over{position:absolute;inset:auto 6px 6px 6px;background:#fff;border-radius:999px;font-size:11px;padding:3px 6px;color:var(--blue)}
.sphoto .count{position:absolute;right:6px;top:6px;background:var(--ink);color:#fff;border-radius:999px;font-size:11px;padding:2px 7px}
.sinfo{display:flex;flex-direction:column;gap:7px;min-width:0}
.supname{font-size:21px;line-height:1.15}
.supname small{font-size:13px;font-weight:400;color:var(--muted)}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px}
.snote{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.rate{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.dot{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.dot.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sedit{grid-column:1/-1;border-top:1px solid var(--soft);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos figure{margin:0;width:110px;display:flex;flex-direction:column;gap:4px}
.photos a{display:block;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}

/* log form (blue panel) */
.logform{flex:1 1 320px;max-width:440px;background:var(--blue);color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;position:sticky;top:84px}
.logform.inline{position:static;max-width:none}
.logform h2{font-size:24px}
.lf{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.lf input,.lf select,.lf textarea{min-height:44px;border:none;border-radius:12px;padding:0 12px;background:#fff;color:var(--ink);width:100%}
.lf textarea{padding:10px 12px;min-height:70px;resize:vertical}
.lf2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lf3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lfgroup{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.12);border-radius:16px;padding:12px}
.lfdrop{border:2px dashed #fff;border-radius:14px;padding:14px;text-align:center;font-size:14px;cursor:pointer}
.logform .drop.over{background:rgba(255,255,255,.2)!important;outline-color:#fff}

/* suppliers */
.sup{background:#fff;border-radius:var(--r)}
.sup-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;padding:18px 20px;border:none;background:none;text-align:left;cursor:pointer;min-height:64px}
.sup-h strong{font-size:19px}
.sup-h .meta{margin-left:auto}
.sup-b{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.srclist{display:flex;flex-direction:column}
.srclist a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--soft);text-decoration:none;color:var(--ink);font-size:14px;flex-wrap:wrap}
.src-Alibaba{background:var(--orange-soft);color:#7a3a0c}
.src-Canton{background:var(--blue-soft);color:var(--blue-d)}
.src-WeChat{background:var(--green-soft);color:var(--green)}

/* thoughts */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tnote{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tnote p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.tnote .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.tnote time{font-size:12px;color:var(--muted);margin-right:auto}
.tlist{display:flex;flex-direction:column;gap:10px}
.tlist p{margin:0;padding:12px 14px;background:var(--bg);border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}

/* quick add panel */
.addpanel{background:var(--blue);color:#fff;border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px}
.addpanel h2{font-size:28px}
.sub{font-size:14px;color:#d6ddff}
.ag3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:760px){.ag3{grid-template-columns:minmax(0,1fr)}}
.addpanel .lf input,.addpanel .lf select{height:50px;font-size:16px}
.crow{display:flex;gap:8px;align-items:center}
.crow .n{width:24px;text-align:right;font-size:13px;color:#d6ddff;flex:0 0 auto}
.crow input{flex:1;min-width:0;height:46px;border:none;border-radius:12px;padding:0 14px;background:#fff;color:var(--ink)}
.xbtn{width:46px;height:46px;border-radius:12px;border:1px solid #8fa0ef;background:transparent;color:#fff;cursor:pointer;flex:0 0 auto;font-size:18px}
.addmore{min-height:40px;padding:0 16px;border-radius:999px;border:2px dashed #fff;background:transparent;color:#fff;cursor:pointer}

/* ===== images ===== */
async function compress(file){
  if(file.type==="image/gif") return file;
  try{
    const bmp = await createImageBitmap(file);
    const max=1600, s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*s), h=Math.round(bmp.height*s);
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    return blob || file;
  }catch(e){ return file }
}
async function uploadFiles(list){
  const files=[...(list||[])].filter(f=>/^image\/(jpeg|png|webp|gif|heic|heif)$/i.test(f.type)||/^image\//.test(f.type));
  if(!files.length){toast("Use an image file (JPG, PNG or WebP).");return []}
  toast(files.length>1?`Uploading ${files.length} photos…`:"Uploading photo…");
  const paths=[];
  for(const f of files){
    const blob = await compress(f);
    const type = blob.type || f.type;
    if(!/^image\/(jpeg|png|webp|gif)$/.test(type)){toast("That photo format isn't supported. Save it as JPG or PNG first.");continue}
    const ext = {"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"}[type];
    const path = `${new Date().getFullYear()}/${crypto.randomUUID()}.${ext}`;
    const {error} = await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,cacheControl:"31536000",upsert:false});
    if(error){toast("Upload failed: "+error.message);continue}
    paths.push(path);
  }
  return paths;
}
function removeFiles(paths){paths=(paths||[]).filter(x=>x&&!/^https?:\/\//i.test(x));if(paths.length)sb.storage.from(BUCKET).remove(paths).catch(()=>{})}

/* ===== Pull image, title and brand from an ASIN ===== */
const AMZ_IMG = a => [`https://m.media-amazon.com/images/P/${a}.01._SCLZZZZZZZ_.jpg`,`https://m.media-amazon.com/images/P/${a}.02._SCLZZZZZZZ_.jpg`];
function probeImg(url){return new Promise(res=>{const i=new Image();i.referrerPolicy="no-referrer";let done=false;const fin=v=>{if(!done){done=true;res(v)}};i.onload=()=>fin(i.naturalWidth>20?url:null);i.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);i.src=url})}
async function lookupAsin(asin){
  if(lookup.ok===false) return null;
  try{
    const {data,error}=await sb.functions.invoke("asin-lookup",{body:{asin}});
    if(error||!data){throw error||new Error("no data")}
    if(data.error==="not_found"){lookup.ok=true;return null}
    if(data.error){const er=new Error(data.error);er.blocked=true;throw er}
    lookup.ok=true; return data;
  }catch(e){
    lookup.ok=false; /* quiet: title/brand auto-fill is not set up, so just skip it */
    return null;
  }
}
async function pullInfo(asin){
  const out={title:"",brand:"",image:""};
  const d=await lookupAsin(asin);
  if(d){out.title=d.title||"";out.brand=d.brand||"";out.image=d.image||""}
  let img=null;
  for(const u of [out.image,...AMZ_IMG(asin)].filter(Boolean)){img=await probeImg(u);if(img)break}
  out.image=img||"";
  return out;
}
function softRefresh(){if(ui.route==="products"){const g=$("#pgrid");if(g){g.innerHTML=gridHtml();return}}requestRender()}

  if(info.title&&!q.name) patch.name=info.title.slice(0,140);
  if(info.brand&&!q.brand) patch.brand=info.brand;

}
async function pullComps(pid){

  asins.forEach(a=>ui.loading.add(`c:${pid}:${a}`)); softRefresh();
  for(const a of asins){
    let info; try{info=await pullInfo(a)}finally{ui.loading.delete(`c:${pid}:${a}`)}
    const p=byId("products",pid); if(!p){softRefresh();return}
    const arr=(p.competitors||[]).map(x=>({...x})); let ch=false;
    arr.forEach(c=>{if((c.asin||parseAsin(c.link))!==a)return;
      if(info.title&&!c.title){c.title=info.title.slice(0,140);ch=true}
      if(info.brand&&!c.brand){c.brand=info.brand;ch=true}
      if(info.image&&!c.image){c.image=info.image;ch=true}});
    if(ch) await upd("products",pid,{competitors:arr});
    softRefresh();
  }
}

/* ----- Competitor helpers ----- */
const numv = v => {if(v==null||v==="")return null;const n=parseFloat(String(v).replace(/[£$,\s]/g,""));return isNaN(n)?null:n};
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
const cleanTxt = t => String(t||"").replace(/[•\s]/g,"");
function cAvg(c){const a=numv(c.list),b=numv(c.sell!=null&&c.sell!==""?c.sell:c.price);if(a!=null&&b!=null)return(a+b)/2;return a!=null?a:b}
const avgText = c => {const v=cAvg(c);return v==null?"—":gbp(v)};
const isWeak = c => c.imgq==="Poor"||c.imgq==="Fair";
function compStats(cs){
  const pr=cs.map(cAvg).filter(v=>v!=null), rv=cs.map(c=>numv(c.reviews)).filter(v=>v!=null);
  return {n:cs.length, range:pr.length?`£${Math.min(...pr).toFixed(0)}–£${Math.max(...pr).toFixed(0)}`:"—",
    avgP:pr.length?gbp(mean(pr)):"—", avgR:rv.length?Math.round(mean(rv)).toLocaleString("en-GB"):"—", weak:cs.filter(isWeak).length};
}
/* simple built-in rules, no AI */
function insights(p){
  const cs=p.competitors||[], out=[]; if(!cs.length) return out;
  const nm = c => c.title || c.asin || parseAsin(c.link) || "A competitor";
  const avgs=cs.map(cAvg).filter(v=>v!=null), weak=cs.filter(isWeak).length, rated=cs.filter(c=>c.imgq&&c.imgq!=="—").length;
  if(weak && weak>=Math.ceil(cs.length/2)) out.push(["good",`${weak} of ${cs.length} competitors have weak images. Strong photos, infographics and A+ content are your easiest win here.`]);
  else if(cs.length>=2 && rated===cs.length && weak===0) out.push(["warn","Every competitor has good images, so photos alone won't set you apart. Look for another angle: bundle, pack size, quality or a feature they're missing."]);
  if(avgs.length>=2){
    const avg=mean(avgs), mn=Math.min(...avgs), mx=Math.max(...avgs);
    if(p.price!=null){
      const d=p.price-avg, pct=Math.round(Math.abs(d)/avg*100);
      if(Math.abs(d)<0.01) out.push(["info",`Your sell price matches the competitor average (${gbp(avg)}).`]);
      else out.push([d>avg*0.15?"warn":"info",`Your sell price (${gbp(p.price)}) is ${gbp(Math.abs(d))} ${d<0?"below":"above"} the competitor average of ${gbp(avg)} (${pct}%).${d>avg*0.15?" You'll need clearly better images or features to justify that.":""}`]);
    } else out.push(["info",`Competitors average ${gbp(avg)}. Add your sell price at the top of this page to compare.`]);
    if(mx-mn>avg*0.3) out.push(["info",`Prices range from ${gbp(mn)} to ${gbp(mx)}, so there's room for a budget version or a premium version.`]);
  }
  const disc=cs.filter(c=>{const l=numv(c.list),s=numv(c.sell);return l!=null&&s!=null&&s<l});
  if(disc.length){const pct=Math.round(mean(disc.map(c=>(numv(c.list)-numv(c.sell))/numv(c.list)*100)));out.push(["info",`${disc.length} competitor${disc.length>1?"s are":" is"} selling below list price (about ${pct}% off). Shoppers here may be price-sensitive.`])}
  const low=cs.filter(c=>{const r=numv(c.rating);return r!=null&&r<4.0});
  if(low.length) out.push(["good",`${low.slice(0,3).map(nm).join(", ")} ${low.length>1?"are":"is"} rated under 4.0. Read their 1–3★ reviews: their complaints are your product spec.`]);
  const rv=cs.map(c=>numv(c.reviews)).filter(v=>v!=null);
  if(rv.length){ if(Math.min(...rv)<300) out.push(["good","At least one competitor has under 300 reviews, so a new listing can still break in."]);
    if(mean(rv)>3000) out.push(["warn",`Competitors average ${Math.round(mean(rv)).toLocaleString("en-GB")} reviews. Expect a slower start and budget for launch ads.`]); }
  const noPrice=cs.length-avgs.length; if(noPrice) out.push(["todo",`${noPrice} competitor${noPrice>1?"s have":" has"} no price yet. Add prices for better price insights.`]);
  const noRate=cs.length-rated; if(noRate) out.push(["todo",`Rate the images for ${noRate} competitor${noRate>1?"s":""}: tap the "Images" badge on the card.`]);
  const noPlan=cs.filter(c=>(isWeak(c)||cleanTxt(c.weak))&&!cleanTxt(c.beat)).length;
  if(noPlan) out.push(["todo",`No "How I beat them" plan yet for ${noPlan} competitor${noPlan>1?"s":""}.`]);
  return out;
}
function summaryHtml(p){
  const cs=p.competitors||[], s=compStats(cs), ins=insights(p);
  return `<div class="cstats">
      <div class="cstat"><span>Competitors</span><b>${s.n}</b></div>
      <div class="cstat"><span>Price range</span><b>${s.range}</b></div>
      <div class="cstat"><span>Average price</span><b>${s.avgP}</b></div>
      <div class="cstat"><span>Average reviews</span><b>${s.avgR}</b></div>
      <div class="cstat or"><span>Weak images</span><b>${s.weak} of ${s.n}</b></div>
    </div>
    ${ins.length?`<div class="ins"><h3>Quick insights</h3><ul>${ins.map(([k,t])=>`<li><span class="k k-${k}">${{good:"Opportunity",warn:"Watch out",info:"Note",todo:"To do"}[k]}</span><span>${esc(t)}</span></li>`).join("")}</ul></div>`:""}
    ${combineHtml(p)}`;
}
/* everything written in the green / red / amber boxes, gathered in one place */
function combineHtml(p){
  const cs=p.competitors||[];
  const ln=t=>String(t||"").split("\n").map(x=>x.replace(/^[\s\-•*·]+/,"").trim()).filter(Boolean);
  const who=(c,i)=>(c.brand||"").trim()||`#${i+1}`;
  const spec=[["cg",c=>c.good,"Steal these","What competitors do well"],["cr",c=>c.weak||c.notes,"Gaps to exploit","What they do badly"],["ca",c=>c.beat,"My plan","What I improve on"]]
    .map(([k,get,h,sub])=>({k,h,sub,items:cs.flatMap((c,i)=>ln(get(c)).map(t=>({t,w:who(c,i)})))}));
  return `<div class="cmb"><button type="button" class="cmbhead" data-act="combine" aria-expanded="${ui.combine}"><b>Ideas to combine</b>
      <span class="cmbcnt">${spec.map(x=>`<i class="${x.k}">${x.items.length}</i>`).join("")}</span><span class="cmbarrow">${ui.combine?"Hide ▴":"Show ▾"}</span></button>
    ${ui.combine?`<div class="cmbcols">${spec.map(x=>`<div class="cmbcol ${x.k}"><h4>${x.h}<em>${x.items.length}</em></h4><p>${x.sub}</p><ul>${x.items.length?x.items.map(y=>`<li><span class="who">${esc(y.w)}</span><span>${esc(y.t)}</span></li>`).join(""):`<li class="none">Nothing yet</li>`}</ul></div>`).join("")}</div>`:""}</div>`;
}

async function productFromText(text,category_id){
  text=(text||"").trim(); const asin=parseAsin(text); const urlM=text.match(/https?:\/\/\S+/i);
  let name=text.replace(/https?:\/\/\S+/ig,"").trim(); if(asin&&name.toUpperCase()===asin) name="";
  name=name.split("\n")[0].slice(0,90);
  const p=await ins("products",{name,asin,url:urlM?urlM[0]:"",category_id:category_id||null});
  if(p&&p.asin) pullProduct(p.id);
  return p;
}
async function setStatus(id,v){
  const s=byId("samples",id); if(!s) return;
  const patch={status:v};
  if(v==="Arrived"){ if(!s.arrived_on) patch.arrived_on=today(); patch.decided_on=null; }
  if(v==="Approved"||v==="Rejected"){ patch.decided_on=today(); if(!s.arrived_on) patch.arrived_on=today(); }
  await upd("samples",id,patch); render();
  toast(v==="Approved"?"Sample approved":v==="Rejected"?"Sample rejected":v==="Arrived"?"Marked as arrived":"Updated");
}
async function doDelete(key){
  const [t,id,i]=key.split(":");
  if(t==="prod"){const p=byId("products",id);if(!p)return;const ss=D.samples.filter(s=>s.product_id===id);
    const PL=p.listing||{};
    removeFiles([p.image_path,...(p.mockups||[]).map(m=>m.path),...ss.flatMap(s=>s.photos||[]),...(PL.pics||[]),...(PL.box||[]),...(PL.aplus||[]).map(m=>m&&m.path)]);
    D.samples=D.samples.filter(s=>s.product_id!==id); await del("products",id); location.hash="products"; toast("Product deleted"); return}
  if(t==="cat"){D.products.forEach(p=>{if(p.category_id===id)p.category_id=null});D.thoughts.forEach(x=>{if(x.category_id===id)x.category_id=null});if(ui.cat===id)ui.cat="";await del("categories",id);toast("Category deleted. Its products are now Uncategorised.")}
  if(t==="sup"){D.samples.forEach(s=>{if(s.supplier_id===id)s.supplier_id=null});ui.openSup=null;await del("suppliers",id);toast("Supplier deleted")}
  if(t==="th"){await del("thoughts",id)}
  if(t==="samp"){const s=byId("samples",id);if(s)removeFiles(s.photos);ui.editSample=null;await del("samples",id);toast("Sample deleted")}
  if(t==="lap"){const p=byId("products",id);if(!p)return;const L=clone(p.listing);if(!L.aplus)L.aplus=DEFAULT_AP.map(x=>({...x}));const [gone]=L.aplus.splice(+i,1);await upd("products",id,{listing:L});if(gone)removeFiles([gone.path])}
  if(t==="comp"||t==="mock"){const p=byId("products",id);if(!p)return;const f=t==="comp"?"competitors":"mockups";const arr=[...(p[f]||[])];const [gone]=arr.splice(+i,1);await upd("products",id,{[f]:arr});if(t==="mock"&&gone)removeFiles([gone.path])}
  if(t==="sph"){const s=byId("samples",id);if(!s)return;const arr=[...(s.photos||[])];const [gone]=arr.splice(+i,1);await upd("samples",id,{photos:arr});removeFiles([gone])}
  render();
}
async function saveField(el){
  let v=el.value; const f=el.dataset.f;
  if(el.dataset.num){const s=String(v).replace(/[£$,\s]/g,"");v=s===""?null:Number(s);if(Number.isNaN(v)){toast("Enter a number, e.g. 12.99");return false}}
  else if(el.dataset.null&&v==="") v=null;
  else if(f==="asin") v=v.trim().toUpperCase();
  if(el.dataset.t){
    const row=byId(el.dataset.t,el.dataset.id); if(!row||row[f]===v) return false;
    if(el.dataset.t==="categories"&&f==="name"&&!String(v).trim()){toast("A category needs a name.");return false}
    if(el.dataset.t==="suppliers"&&f==="name"&&!String(v).trim()){toast("A supplier needs a name.");return false}
    await upd(el.dataset.t,el.dataset.id,{[f]:v}); return true;
  }
  if(el.dataset.lst){
    const p=byId("products",el.dataset.id); if(!p) return false;
    const L=clone(p.listing), path=el.dataset.lst.split("."), k=x=>isNaN(x)?x:+x;
    if(path[0]==="aplus"&&!L.aplus) L.aplus=DEFAULT_AP.map(x=>({...x}));
    let o=L; for(let n=0;n<path.length-1;n++){const key=k(path[n]); if(o[key]==null) o[key]=isNaN(path[n+1])?{}:[]; o=o[key]}
    const last=k(path[path.length-1]); if((o[last]||"")===v) return false; o[last]=v;
    await upd("products",p.id,{listing:L}); return true;
  }
  if(el.dataset.arr){
    const p=byId("products",el.dataset.id); if(!p) return false;
    const arr=(p[el.dataset.arr]||[]).map(x=>({...x})); const i=+el.dataset.i;
    if(!arr[i]||arr[i][f]===v) return false; arr[i][f]=v;
    await upd("products",p.id,{[el.dataset.arr]:arr}); return true;
  }
  return false;
}

document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]"); if(!f) return; e.preventDefault();
  if(ui.busy) return;
  const d=Object.fromEntries(new FormData(f).entries()); const k=f.dataset.form; const as=(e.submitter&&e.submitter.value)||"";
  const btns=[...f.querySelectorAll("button[type=submit]")]; btns.forEach(b=>b.disabled=true); ui.busy=true;
  try{
    if(k==="dump"){const text=(d.text||"").trim();if(!text)return;
      if(as==="product"){const p=await productFromText(text,d.category_id);if(p){location.hash="p/"+p.id;toast("Product created")}}
      else{const t=await ins("thoughts",{text,category_id:d.category_id||null});if(t){f.reset();toast("Thought saved");render()}}}
    if(k==="addprod"){const q=(d.q||"").trim();const p=await productFromText(q,(ui.cat&&ui.cat!=="none")?ui.cat:null);if(p)location.hash="p/"+p.id}
    if(k==="addcat"){const name=(d.name||"").trim();if(!name)return;const mx=Math.max(0,...D.categories.map(c=>c.sort||0));const c=await ins("categories",{name,sort:mx+1});if(c){toast("Category added");render()}}
    if(k==="addcomp"){const p=byId("products",f.dataset.id);if(!p)return;
      const have=new Set((p.competitors||[]).map(c=>c.asin||parseAsin(c.link)).filter(Boolean));
      const parts=splitLinks(d.q); if(!parts.length) return; const add=[], skipped=[];
      parts.forEach(q=>{const a=parseAsin(q);if(a&&have.has(a)){skipped.push(a);return}if(a)have.add(a);add.push(newComp(q))});
      if(add.length) await upd("products",p.id,{competitors:[...(p.competitors||[]),...add]});
      toast(skipped.length?`${add.length} added. Already listed: ${skipped.join(", ")}`:`${add.length} competitor${add.length>1?"s":""} added`); render(); if(add.length) pullComps(p.id)}
    if(k==="quickadd"){
      const a=ui.add, name=a.name.trim(), raw=a.asin.trim(), asin=parseAsin(raw)||raw.toUpperCase();
      if(!asin&&!name){toast("Add an ASIN or a product name.");const n=$("#addasin");if(n)n.focus();return}
      const seen=new Set(); const comps=a.rows.map(r=>r.trim()).filter(Boolean).filter(r=>{const x=parseAsin(r);if(!x)return true;if(seen.has(x))return false;seen.add(x);return true}).map(newComp);
      const photo=a.files.length?(await uploadFiles(a.files))[0]:null;
      const cat=a.cat||((ui.cat&&ui.cat!=="none")?ui.cat:"");
      const row={name,asin,category_id:cat||null,competitors:comps,image_path:photo||null}; if(isUrl(raw)) row.url=raw;
      const p=await ins("products",row);
      if(!p) return;
      ui.add={name:"",asin:"",cat:a.cat,rows:["",""],files:[]};
      render(); toast(`Added ✓ ${name||asin}`);
      const n=$("#addasin"); if(n) n.focus();
      (async()=>{await pullProduct(p.id);await pullComps(p.id)})();
    }
    if(k==="addsup"){const name=(d.name||"").trim();if(!name)return;const s=await ins("suppliers",{name,source:d.source,wechat:d.wechat||"",alibaba:d.alibaba||"",contact:d.contact||""});if(s){ui.openSup=s.id;toast("Supplier added");render()}}
    if(k==="logsample"){
      let supplier_id=d.supplier_id;
      if(supplier_id==="__new"){
        const name=(d.sup_name||"").trim(); if(!name){toast("Add the supplier's name.");return}
        const c=(d.sup_contact||"").trim(); const row={name,source:d.sup_source||"Alibaba"};
        if(isUrl(c)) row.alibaba=c; else if(row.source==="WeChat") row.wechat=c; else row.contact=c;
        const s=await ins("suppliers",row); if(!s) return; supplier_id=s.id;
      }
      const photos = ui.pending.length ? await uploadFiles(ui.pending) : [];
      const st=d.status||"On the way";
      const row={product_id:d.product_id,supplier_id,status:st,sample_cost:d.sample_cost||"",unit_price:d.unit_price||"",moq:d.moq||"",tracking:d.tracking||"",eta:d.eta||null,notes:d.notes||"",photos,
                 arrived_on:st==="On the way"?null:today(),decided_on:(st==="Approved"||st==="Rejected")?today():null};
      const s=await ins("samples",row);
      if(s){ui.pending=[];ui.newSup=false;const p=byId("products",d.product_id);if(p&&["Idea","Researching","Shortlisted"].includes(p.status))await upd("products",p.id,{status:"Sampling"});toast("Sample logged");render()}
    }
  } finally { ui.busy=false; btns.forEach(b=>b.disabled=false); }
});

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(!a){ if(ui.confirm&&view.contains(e.target)){ui.confirm=null;render()} return }
  const act=a.dataset.act, v=a.dataset.v, id=a.dataset.id;
  flushSaves();
  if(act!=="del"&&ui.confirm) ui.confirm=null;
  const sameHash = h => (location.hash||"#dashboard")==="#"+h;
  switch(act){
    case "tab": ui.tab=v; render(); break;
    case "openadd": ui.addOpen=true; render(); {const n=$("#addasin"); if(n) n.focus();} break;
    case "pullasin": pullProduct(id).then(()=>pullComps(id)); toast("Checking the ASIN…"); break;
    case "pullcomps": pullComps(id); break;
    case "preview": openPreview(id); break;
    case "addmod": {const p=byId("products",id); if(!p) break; const L=clone(p.listing); L.aplus=[...(L.aplus||DEFAULT_AP.map(x=>({...x}))),{type:"Brand story"}]; upd("products",id,{listing:L}); render(); break;}
    case "lclear": {const [kind,ix]=v.split(":"), p=byId("products",id); if(!p) break; const L=clone(p.listing); let old;
      if(kind==="lap"){if(!L.aplus)L.aplus=DEFAULT_AP.map(x=>({...x}));const m=L.aplus[+ix];if(m){old=m.path;delete m.path}}
      else{const key=kind==="lpic"?"pics":"box";const arr=Array.from({length:kind==="lpic"?7:6},(_,i)=>(L[key]||[])[i]||null);old=arr[+ix];arr[+ix]=null;L[key]=arr}
      upd("products",id,{listing:L}); removeFiles([old]); render(); break;}
    case "closeadd": ui.addOpen=false; render(); break;
    case "addrow": ui.add.rows.push(""); refreshRows(); {const n=$("#ar"+(ui.add.rows.length-1)); if(n) n.focus();} break;
    case "rmrow": ui.add.rows.splice(+v,1); if(!ui.add.rows.length) ui.add.rows=[""]; refreshRows(); break;
    case "cmode": ui.cmode=v; render(); break;
    case "combine": ui.combine=!ui.combine; refreshSummary(); break;
    case "topen": ui.titleOpen.add(id+":"+v); render(); {const n=$("#ct-"+v); if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}}} break;
    case "ttoggle": {const k=id+":"+v; if(ui.titleOpen.has(k)) ui.titleOpen.delete(k); else ui.titleOpen.add(k); render(); break;}
    case "iq": {const p=byId("products",id); if(!p) break; const arr=(p.competitors||[]).map(x=>({...x})); const c=arr[+v]; if(!c) break;
      const o=["—","Poor","Fair","Good"]; c.imgq=o[(o.indexOf(c.imgq||"—")+1)%o.length]; upd("products",id,{competitors:arr}); render(); break;}
    case "cat": ui.cat=v; render(); break;
    case "gocat": ui.cat=v||""; ui.stage=""; ui.q=""; if(sameHash("products")) render(); break;
    case "managecats": ui.manageCats=!ui.manageCats; render(); break;
    case "managecats-go": ui.manageCats=true; if(sameHash("products")) render(); break;
    case "gosamples": ui.sstatus=v||""; ui.sprod=""; if(sameHash("samples")) render(); break;
    case "sfilter": ui.sstatus=v; render(); break;
    case "srcfilter": ui.ssrc=v; render(); break;
    case "tfilter": ui.tcat=v; render(); break;
    case "opensup": ui.openSup=ui.openSup===v?null:v; render(); break;
    case "editsample": ui.editSample=ui.editSample===v?null:v; render(); break;
    case "setstatus": setStatus(id,v); break;
    case "rate": upd("samples",id,{quality:Number(v)}); render(); break;
    case "setmain": {const p=byId("products",id); if(!p) break; const ms=[...(p.mockups||[])]; const [m]=ms.splice(+v,1); if(!m) break;
      if(p.image_path) ms.unshift({path:p.image_path,caption:"Previous main photo"});
      upd("products",id,{image_path:m.path,mockups:ms}); render(); toast("Main photo updated"); break;}
    case "t2p": {const t=byId("thoughts",id); if(!t) break; productFromText(t.text,t.category_id).then(p=>{if(p)location.hash="p/"+p.id}); break;}
    case "del": { const key=a.dataset.key; if(ui.confirm!==key){ui.confirm=key;render();return} ui.confirm=null; doDelete(key); break; }
  }
});

function refreshRows(){const r=$("#addrows");if(r)r.innerHTML=rowsHtml();const w=$("#dupwarn");if(w)w.innerHTML=dupHtml()}
function grow(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
function growAll(){document.querySelectorAll("textarea.bul,textarea.agrow").forEach(grow)}
const timers=new WeakMap(), pendingEls=new Set();
function flushSaves(){pendingEls.forEach(el=>{clearTimeout(timers.get(el));if(document.contains(el))saveField(el)});pendingEls.clear()}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="psearch"){ui.q=el.value;const g=$("#pgrid");if(g)g.innerHTML=gridHtml();return}
  if(el.dataset.add){
    if(el.dataset.add==="row") ui.add.rows[+el.dataset.i]=el.value; else ui.add[el.dataset.add]=el.value;
    if(el.dataset.add==="asin"||el.dataset.add==="row"){const w=$("#dupwarn");if(w)w.innerHTML=dupHtml()}
    return;
  }
  if(el.classList.contains("bul")||el.classList.contains("agrow")) grow(el);
  if(el.dataset.max) updCount(el);
  if(el.dataset.arr==="competitors"&&(el.dataset.f==="list"||el.dataset.f==="sell")){
    const card=el.closest(".cc"); if(card){const L=card.querySelector('[data-f="list"]').value,S2=card.querySelector('[data-f="sell"]').value;const b=card.querySelector("[data-avg]");if(b)b.textContent=avgText({list:L,sell:S2})}
  }
  if(el.matches("[data-t],[data-arr],[data-lst]")&&el.matches("input:not([type=date]):not([type=file]),textarea")){
    clearTimeout(timers.get(el)); pendingEls.add(el); timers.set(el,setTimeout(()=>{pendingEls.delete(el);saveField(el).then(refreshListingMeta)},800));
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="sprodfilter"){ui.sprod=el.value;render();return}
  if(el.id==="stagefilter"){ui.stage=el.value;render();return}
  if(el.dataset.add==="cat"){ui.add.cat=el.value;return}
  if(el.dataset.role==="supsel"){ui.newSup=el.value==="__new";const g=el.closest("form").querySelector('[data-role="newsup"]');if(g)g.hidden=!ui.newSup;return}
  if(el.matches("[data-upload]")){const files=[...el.files];el.value="";handleFiles(el.dataset.upload,el.dataset.id,files,el.dataset.i);return}
  if(el.matches("[data-t],[data-arr],[data-lst]")){
    clearTimeout(timers.get(el)); pendingEls.delete(el);
    saveField(el).then(ch=>{ refreshListingMeta(); if(ch && el.dataset.arr==="competitors") refreshSummarySoon(); else if(ch && (el.tagName==="SELECT"||el.dataset.num||el.type==="date")) requestRender();
      if(ch && el.dataset.f==="asin" && el.dataset.t==="products"){const dup=D.products.find(x=>x.id!==el.dataset.id&&x.asin&&x.asin===el.value.trim().toUpperCase());if(dup)toast(`Heads up: ${pname(dup)} already uses this ASIN.`); pullProduct(el.dataset.id)} });
  }
});
/* bullet-point boxes: start with a bullet, Enter adds the next one */
document.addEventListener("focusin",e=>{const t=e.target;if(t.classList&&t.classList.contains("bul")&&!t.value){t.value="• ";t.setSelectionRange(2,2)}});
document.addEventListener("focusout",e=>{const t=e.target;if(t.classList&&t.classList.contains("bul")&&t.value.trim()==="•"){t.value="";grow(t);t.dispatchEvent(new Event("change",{bubbles:true}))}},true);
document.addEventListener("keydown",e=>{const t=e.target;if(!(t.classList))return;
  if(t.classList.contains("ctview")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();return}
  if(t.classList.contains("ctarea")&&e.key==="Enter"){e.preventDefault();t.blur()}});
document.addEventListener("keydown",e=>{const t=e.target;if(!(t.classList&&t.classList.contains("bul"))||e.key!=="Enter"||e.shiftKey||e.isComposing)return;
  e.preventDefault();const s=t.selectionStart,en=t.selectionEnd;t.value=t.value.slice(0,s)+"\n• "+t.value.slice(en);t.selectionStart=t.selectionEnd=s+3;t.dispatchEvent(new Event("input",{bubbles:true}))});
/* paste several competitor links into one row → one row each */
document.addEventListener("paste",e=>{const el=e.target;if(!(el.dataset&&el.dataset.add==="row"))return;
  const t=(e.clipboardData&&e.clipboardData.getData("text"))||"";const parts=splitLinks(t);if(parts.length<2)return;
  e.preventDefault();const i=+el.dataset.i;const cur=ui.add.rows[i].trim();ui.add.rows.splice(i,1,...(cur?[cur]:[]),...parts);refreshRows();toast(`${parts.length} competitors added as separate rows`)},true);

/* a picture that fails to load just hides, so the placeholder text underneath shows */
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.closest(".pimg,.hero,.cimg,.lslot,.thumb,.sphoto"))t.style.display="none"},true);

/* drag & drop + paste */
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes("Files");
document.addEventListener("dragover",e=>{if(!hasFiles(e))return;e.preventDefault();const z=e.target.closest("[data-drop]");document.querySelectorAll(".drop.over").forEach(x=>{if(x!==z)x.classList.remove("over")});if(z)z.classList.add("over")});
document.addEventListener("dragleave",e=>{const z=e.target.closest("[data-drop]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();const z=e.target.closest("[data-drop]");document.querySelectorAll(".drop.over").forEach(x=>x.classList.remove("over"));if(!z)return;handleFiles(z.dataset.drop,z.dataset.id,e.dataTransfer.files,z.dataset.i)});
document.addEventListener("paste",e=>{
  if(!user||editing()) return;
  const files=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(f=>/^image\//.test(f.type)); if(!files.length) return;
  if(ui.route==="product"){e.preventDefault();const p=byId("products",ui.id);if(!p)return;
    if(ui.tab==="listing"){const pics=(p.listing||{}).pics||[];let i=0;while(i<6&&pics[i])i++;handleFiles("lpic",p.id,files,i);return}
    handleFiles(!p.image_path?"pmain":"pmock",p.id,files);return}
  if(ui.route==="products"){e.preventDefault();handleFiles("newprod",null,files)}
});

/* ===== Excel export ===== */
function exportXlsx(){
  if(!window.XLSX){toast("Export is still loading. Try again in a second.");return}
  const X=window.XLSX, cat=catName, sup=id=>(supOf(id)||{}).name||"";
  const sheet=(rows)=>X.utils.json_to_sheet(rows.length?rows:[{"":"(empty)"}]);
  const products=S.products().map(p=>({"Product":pname(p),"Brand":p.brand||"","Category":cat(p.category_id),"Stage":p.status,"ASIN":p.asin,"Link":p.url,"Sell price £":p.price,"Unit cost £":p.cost,"Amazon fees £":p.fees,"Est. sales / month":p.sales,
    "Stand out":p.standout,"Competitor weak spots":p.weaknesses,"Title":p.title,"Bullet 1":p.bullet1,"Bullet 2":p.bullet2,"Bullet 3":p.bullet3,"Bullet 4":p.bullet4,"Bullet 5":p.bullet5,"Description":p.description,"Keywords":p.keywords,"Notes":p.notes,
    "Main photo":imgUrl(p.image_path),"Listing pictures":((p.listing||{}).pics||[]).filter(Boolean).map(imgUrl).join("\n"),"Box images":((p.listing||{}).box||[]).filter(Boolean).map(imgUrl).join("\n"),"A+ designs":((p.listing||{}).aplus||[]).filter(m=>m&&m.path).map(m=>(m.type||"")+": "+imgUrl(m.path)).join("\n"),"Mockups":(p.mockups||[]).map(m=>imgUrl(m.path)).join("\n"),"Added":fmtAdded(p.created_at)}));
  const comps=S.products().flatMap(p=>(p.competitors||[]).map(c=>({"Product":pname(p),"Competitor":c.title,"Brand":c.brand||"","ASIN":c.asin||parseAsin(c.link),"Link":c.link,"List price £":numv(c.list),"Selling price £":numv(c.sell||c.price),"Average £":cAvg(c)==null?null:Number(cAvg(c).toFixed(2)),"Rating":numv(c.rating),"Reviews":numv(c.reviews),"Their images":c.imgq,"What they do well":c.good||"","Weak spots":c.weak||c.notes||"","How I beat them":c.beat||"","Image":imgUrl(c.image)})));
  const samples=S.samples().map(s=>({"Product":pname(byId("products",s.product_id)),"Supplier":sup(s.supplier_id),"Where found":(supOf(s.supplier_id)||{}).source||"","Status":s.status,"Sample cost":s.sample_cost,"Unit price":s.unit_price,"MOQ":s.moq,"Quality /5":s.quality,"Tracking":s.tracking,"ETA":dmy(s.eta),"Arrived":dmy(s.arrived_on),"Decided":dmy(s.decided_on),"Notes":s.notes,"Photos":(s.photos||[]).map(imgUrl).join("\n"),"Logged":dmy(s.created_at)}));
  const sups=S.suppliers().map(s=>({"Supplier":s.name,"Where found":s.source,"WeChat":s.wechat,"Alibaba":s.alibaba,"Contact":s.contact,"Phone / email":s.phone,"Notes":s.notes,"Added":dmy(s.created_at)}));
  const thoughts=S.thoughts().map(t=>({"Thought":t.text,"Category":t.category_id?cat(t.category_id):"","Added":dmy(t.created_at)}));
  const cats=S.categories().map(c=>({"Category":c.name,"Products":D.products.filter(p=>p.category_id===c.id).length}));
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,sheet(products),"Products");
  X.utils.book_append_sheet(wb,sheet(comps),"Competitors");
  X.utils.book_append_sheet(wb,sheet(samples),"Samples");
  X.utils.book_append_sheet(wb,sheet(sups),"Suppliers");
  X.utils.book_append_sheet(wb,sheet(thoughts),"Brain dump");
  X.utils.book_append_sheet(wb,sheet(cats),"Categories");
  X.writeFile(wb,`PL-Hub-backup-${dmy(today()).split("/").join("-")}.xlsx`);
}
$("#exportbtn").addEventListener("click",exportXlsx);

/* ===== auth ===== */
function showLogin(){user=null;loaded=false;TABLES.forEach(t=>D[t]=[]);$("#app").hidden=true;$("#login").hidden=false;setTimeout(()=>$("#lu").focus(),50)}
function start(u){user=u;lookup.ok=null;lookup.warned=false;$("#login").hidden=true;$("#app").hidden=false;route();loadAll()}
async function signOut(){await sb.auth.signOut().catch(()=>{});showLogin()}
$("#signout").addEventListener("click",signOut);
$("#loginform").addEventListener("submit",async e=>{
  e.preventDefault();
  const u=$("#lu").value.trim(), pw=$("#lp").value, err=$("#loginerr"), btn=$("#loginbtn");
  const email = u.includes("@") ? u : `${u.toLowerCase()}@${LOGIN_DOMAIN}`;
  err.hidden=true; btn.disabled=true; btn.textContent="Signing in…";
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false; btn.textContent="Sign in";
  if(error){err.textContent="Wrong username or password.";err.hidden=false;return}
  $("#lp").value=""; start(data.user);
});
window.addEventListener("focus",()=>{if(user&&Date.now()-lastLoad>60000&&!editing())loadAll()});
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"&&user)showLogin()});
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)start(data.session.user);else showLogin()})();
})();
